<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGen World · playable 3D prototype (with sound)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0A0A0A;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.grab{cursor:grabbing}

.glass{background:rgba(26,26,24,.86);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hud{position:fixed;z-index:20}
.top{left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.me{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:18px}
.ava{position:relative;flex:none;width:50px;height:50px;border-radius:50%;padding:3px;background:conic-gradient(#FFD400 0 62%,rgba(255,255,255,.15) 0)}
.ava span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#2A2926;color:#FFD400;font-weight:800;font-size:17px}
.ava b{position:absolute;right:-5px;bottom:-3px;min-width:22px;height:22px;border-radius:11px;background:#FFD400;color:#0A0A0A;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #1A1A18}
.me small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
.me strong{display:block;font-family:'Josefin Sans',sans-serif;font-size:19px;font-weight:700;line-height:1.1}
.xp{width:150px;height:6px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.xp i{display:block;width:0;transition:width 1s;height:100%;border-radius:6px;background:#FFD400;box-shadow:0 0 10px rgba(255,212,0,.6)}
.stat{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:16px;font-weight:800;font-size:15px;white-space:nowrap}
.stat .k{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1}
.ibtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff}
.ibtn svg{width:22px;height:22px}
.place{left:50%;top:84px;transform:translateX(-50%);padding:8px 18px;border-radius:999px;font-family:'Josefin Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:#FFD400}
.bottom{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap}
.pill.y{background:#FFD400;color:#0A0A0A;box-shadow:0 6px 18px rgba(255,212,0,.35)}
.hint{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:19;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;transition:opacity .6s}
.callout{position:fixed;z-index:15;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;padding:9px 14px;border-radius:999px;background:#0A0A0A;color:#FFD400;font-weight:800;font-size:13px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4);border:2px solid #FFD400;transition:opacity .2s}
.callout::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#FFD400;border-bottom:0}
.toast{position:fixed;left:50%;bottom:84px;z-index:40;transform:translate(-50%,20px);opacity:0;transition:all .3s;padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:14px;background:#0A0A0A;transition:opacity .6s}
#loading b{font-family:'Josefin Sans',sans-serif;font-size:28px;color:#FFD400;letter-spacing:.06em}
#loading i{width:180px;height:6px;border-radius:6px;background:#2A2926;overflow:hidden;position:relative}
#loading i::after{content:"";position:absolute;inset:0;width:40%;background:#FFD400;border-radius:6px;animation:load 1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

#card{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;background:rgba(10,10,10,.45)}
#card.open{display:grid}
.panel{width:min(520px,100%);max-height:100%;overflow:auto;border-radius:28px;padding:0 0 20px;background:#1A1A18;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:panel .45s cubic-bezier(.2,.9,.2,1.2)}
@keyframes panel{from{opacity:0;transform:translateY(40px) scale(.9)}}
.art{position:relative;height:170px;border-radius:28px 28px 0 0;overflow:hidden;display:grid;place-items:center}
.art .big{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:'Josefin Sans';font-size:46px;font-weight:700;color:#0A0A0A;box-shadow:0 0 0 6px #FFD400,0 0 0 10px #0A0A0A,0 18px 40px rgba(0,0,0,.45);background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 30%,var(--c2) 100%)}
.lv-no{position:absolute;left:18px;top:16px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.08em;background:rgba(0,0,0,.45)}
.x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.body{padding:18px 22px 0}
.body h2{font-family:'Josefin Sans',sans-serif;font-size:clamp(26px,5vw,32px);font-weight:700;line-height:1.1}
.body p{margin-top:8px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.5}
.stars3{font-size:26px;letter-spacing:4px;color:rgba(255,255,255,.2)}
.stars3 .on{color:#FFD400}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.goal{border-radius:14px;padding:10px;background:#2A2926;border:1px solid #4A4843;text-align:center}
.goal b{display:block;font-size:13px;color:#FFD400}
.goal small{display:block;font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.go{display:flex;justify-content:center;width:calc(100% - 44px);margin:18px 22px 0;padding:16px;border-radius:18px;font-family:'Josefin Sans',sans-serif;font-size:21px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#FFD400;color:#0A0A0A;box-shadow:0 6px 18px rgba(255,212,0,.35)}
.go:active{transform:translateY(2px)}

@media (max-width:640px){
  .me{padding:6px 12px 6px 6px}.ava{width:42px;height:42px}.me strong{font-size:15px}.xp{width:92px}
  .stat.streak{display:none}.stat .k{display:none}
  .place{top:76px;font-size:10.5px}
  .pill{padding:10px 13px;font-size:13px}
  .hint{font-size:11px}
}
/* ---------- playing a level ---------- */
#game{position:fixed;inset:0;z-index:35;display:none;overflow:auto;background:radial-gradient(circle at 50% -10%,color-mix(in srgb,var(--c) 40%,#0A0A0A),#0A0A0A 65%)}
#game.open{display:block;animation:gin .35s ease}
@keyframes gin{from{opacity:0;transform:scale(1.04)}}
.gwrap{width:min(720px,100%);margin:0 auto;padding:16px 16px 48px}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.gx{flex:none;width:46px;height:46px;border-radius:14px;background:#2A2926;color:#fff;font-size:20px}
.ghead small{display:block;color:var(--c);font-weight:800;letter-spacing:.12em;font-size:12px;filter:brightness(1.3)}
.ghead h2{font-family:'Josefin Sans',sans-serif;font-size:clamp(22px,4vw,30px);line-height:1.1}
.gq{font-size:17px;font-weight:700;line-height:1.45;margin-bottom:14px}
.gmsg{margin-top:12px;min-height:22px;color:rgba(255,255,255,.85);font-weight:600;line-height:1.45}
.yel{background:#FFD400;color:#0A0A0A;border-radius:14px;padding:14px 22px;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(255,212,0,.3)}
.yel.sm{padding:9px 13px;font-size:13px;margin-top:6px;box-shadow:none}
.ghost{background:#2A2926;color:#fff;border:1px solid #4A4843;border-radius:14px;padding:14px 22px;font-weight:800;font-size:16px}
#game button:disabled{opacity:.4;cursor:not-allowed}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:6px;border-radius:6px;background:#2A2926}.prog i.on{background:var(--c)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#1A1A18;border:2px solid #4A4843;border-radius:16px;padding:14px;color:#fff;font-size:16px;font-weight:600;margin-top:10px;transition:border-color .2s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(4px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:#2A2926;display:grid;place-items:center;font-weight:900}
#game .opt.right{border-color:#2FA36B;background:#12301f;opacity:1}#game .opt.right .k{background:#2FA36B}
#game .opt.wrong{border-color:#E3473B;background:#3a1512;opacity:1}#game .opt.wrong .k{background:#E3473B}
.mg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bal,.jar{flex:1;min-width:210px;background:#1A1A18;border:1px solid #4A4843;border-radius:18px;padding:14px}
.bal small,.jar small{display:block;color:rgba(255,255,255,.6);font-weight:800;letter-spacing:.12em;font-size:11px}
.bal b{display:block;font-family:'Josefin Sans',sans-serif;font-size:40px;color:#FFD400;line-height:1.15}
.bal b.low{color:#E3473B;animation:shake .4s}
.jar{display:flex;gap:12px;align-items:center}.jar > span{font-size:40px}.jar b{display:block;font-size:22px}
.days{display:flex;gap:6px;margin-top:6px}.days span{font-size:11px;font-weight:800;padding:4px 7px;border-radius:7px;background:#2A2926;color:rgba(255,255,255,.5)}.days span.on{background:#FFD400;color:#0A0A0A}
.buys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.buy{background:#1A1A18;border:2px solid #4A4843;border-radius:14px;padding:12px 8px;color:#fff;font-weight:700;font-size:14px;display:grid;gap:4px;transition:transform .15s,border-color .2s}
.buy span{color:#ff7a6e;font-size:12px}.buy:hover:not(:disabled){border-color:#FFD400;transform:translateY(-3px)}.buy.bought{border-color:#FFD400;background:#2b2410}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{background:#1A1A18;border:2px solid #4A4843;border-radius:18px;padding:16px;color:#fff;text-align:left;font-size:14px;line-height:1.45;transition:transform .15s,border-color .2s}
.team:hover{transform:translateY(-3px)}
.team b{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.06em}
.team.a b{color:#4FC3B8}.team.b b{color:#ff6fa3}
.team.pick{border-color:#FFD400;box-shadow:0 0 0 3px rgba(255,212,0,.25)}
.split{display:flex;height:36px;border-radius:12px;overflow:hidden;margin-top:12px;font-weight:800;font-size:13px}
.split div{display:flex;align-items:center;padding:0 12px;white-space:nowrap;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.split .a{background:#2E7D7A}.split .b{flex:1;justify-content:flex-end;background:#E0457B}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#2A2926;border:1px solid #4A4843;color:#fff;border-radius:999px;padding:11px 15px;font-weight:700;font-size:14px}.chip:hover{border-color:#FFD400}
.scard{min-height:150px;display:grid;place-items:center;text-align:center;font-size:clamp(17px,3vw,21px);font-weight:800;line-height:1.35;background:#F7F7F5;color:#0A0A0A;border-radius:22px;padding:22px;transition:transform .35s,opacity .35s;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.scard.l{transform:translateX(-140px) rotate(-14deg);opacity:0}.scard.r{transform:translateX(140px) rotate(14deg);opacity:0}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sbtns button{padding:16px;border-radius:16px;font-weight:900;font-size:16px;color:#fff}
.b-cheat{background:#E3473B}.b-buddy{background:#2FA36B}
.timer{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;font-size:14px}.timer span:last-child{color:#FFD400;font-size:18px}
.ws{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:440px;margin:0 auto}
.ws button{aspect-ratio:1;border-radius:9px;background:#1A1A18;border:1px solid #4A4843;color:#fff;font-weight:900;font-size:clamp(13px,3.6vw,18px);transition:transform .1s}
.ws button.hit{background:#FFD400;color:#0A0A0A;transform:scale(1.08)}.ws button.got{background:#6B4FD8;border-color:#6B4FD8}
.wl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.wl span{padding:5px 10px;border-radius:999px;background:#2A2926;font-size:12px;font-weight:800;letter-spacing:.06em}.wl span.got{background:#6B4FD8;text-decoration:line-through}
.boss{text-align:center}.boss small{display:block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#ff7a6e}
.hp{height:16px;border-radius:999px;background:#2A2926;overflow:hidden;border:1px solid #4A4843;max-width:360px;margin:0 auto}.hp i{display:block;height:100%;background:linear-gradient(90deg,#E3473B,#fcb92e);transition:width .5s}
.tbar{height:6px;border-radius:6px;background:#2A2926;overflow:hidden;margin:12px 0}.tbar i{display:block;height:100%;background:#FFD400}
.bossface{font-size:72px;line-height:1;text-align:center;margin:4px 0 10px;animation:bob 1.2s ease-in-out infinite}
.bossface.hit{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.res{text-align:center;padding-top:6px}
.res-stars{font-size:clamp(52px,12vw,70px);letter-spacing:8px;line-height:1}.res-stars span{display:inline-block;color:#2A2926;animation:starin .5s cubic-bezier(.2,.9,.3,1.5) both}.res-stars span.on{color:#FFD400;text-shadow:0 0 24px rgba(255,212,0,.6)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.res h3{font-family:'Josefin Sans',sans-serif;font-size:34px;margin-top:8px}
.res p{color:rgba(255,255,255,.78);margin-top:6px;line-height:1.5}
.res-pts{display:inline-block;margin-top:14px;padding:10px 20px;border-radius:999px;background:#FFD400;color:#0A0A0A;font-weight:900;font-size:20px;animation:starin .5s .9s both}
.res-xp{margin:18px auto 0;max-width:420px;text-align:left;background:#1A1A18;border:1px solid #4A4843;border-radius:16px;padding:14px}
.res-xp-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.res-xp-top span{color:#FFD400;font-weight:800}
.xpbar{height:10px;border-radius:10px;background:#2A2926;overflow:hidden}.xpbar i{display:block;height:100%;background:#FFD400;transition:width 1.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(255,212,0,.6)}
.res-xp small{display:block;margin-top:6px;color:rgba(255,255,255,.6)}
.rankup{margin:14px auto 0;max-width:420px;padding:12px;border-radius:14px;background:#6B4FD8;font-weight:900;animation:starin .6s 1s both}
.api{margin:16px auto 0;max-width:540px;text-align:left;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.72);background:#111;border:1px dashed #4A4843;border-radius:12px;padding:12px 14px}
.api b{color:#FFD400;font-family:Inter,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.api span{color:rgba(255,255,255,.5)}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
@media (max-width:640px){.buys{grid-template-columns:repeat(2,1fr)}.teams{grid-template-columns:1fr}.top{gap:6px}.ibtn{width:42px;height:42px}}
.teaser .hud,.teaser .hint,.teaser .callout,.teaser .toast{display:none!important}.teaser #c{cursor:pointer}.teaser #loading b{font-size:20px}
</style>
</head>
<body>
<canvas id="c" aria-label="NextGen World. Drag to look around, scroll or pinch to zoom, tap a level."></canvas>
<div id="loading"><b>NEXTGEN WORLD</b><i></i></div>

<div class="hud top">
  <div class="me glass"><div class="ava" id="avaRing"><span>AO</span><b id="lvlNum">1</b></div><div><small id="lvlSmall">Level 1</small><strong id="rankName">Rookie</strong><div class="xp"><i id="xpFill"></i></div></div></div>
  <div class="spacer"></div>
  <div class="stat glass streak">🔥 1 <span class="k">day streak</span></div>
  <div class="stat glass"><span style="color:#FFD400">⚡</span> <span id="ptsNum">0</span> <span class="k">pts</span></div>
  <button class="ibtn glass" id="snd" aria-label="Sound on or off" title="Sound" style="font-size:19px">🔊</button>
  <button class="ibtn glass" id="reset" aria-label="Reset the demo" title="Reset the demo" style="font-size:20px">↺</button>
  <button class="ibtn glass" id="night" aria-label="Day or night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div>
<div class="hud place glass" id="place">Oct 2026 Island</div>
<div class="hint" id="hint">✋ Drag to look around · Scroll or pinch to zoom · Tap a level · 🔊 Sound on</div>
<div class="hud bottom">
  <button class="pill glass" id="btnWorld">🌍 World</button>
  <button class="pill y" id="btnMe">📍 My level</button>
</div>
<div class="callout" id="callout">▶ Debate · Play</div>
<div class="toast glass" id="toast" role="status"></div>
<div id="game" role="dialog" aria-modal="true" aria-labelledby="gTitle"><div class="gwrap"><div class="ghead"><button class="gx" id="gX" aria-label="Back to the world">←</button><div><small id="gLv"></small><h2 id="gTitle"></h2></div></div><div id="gBody"></div></div></div>

<div id="card" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="panel">
    <div class="art" id="cArt"><div class="big" id="cBig"></div><span class="lv-no" id="cNo"></span><button class="x" id="cX" aria-label="Close">×</button></div>
    <div class="body">
      <div class="stars3" id="cStars"></div>
      <h2 id="cTitle"></h2>
      <p id="cText"></p>
      <div class="goals" id="cGoals"></div>
    </div>
    <button class="go" id="cGo">Play</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =============================================================
   NextGen World · 3D prototype
   One island per edition. A yellow road climbs the mountain;
   each stop is a level (a game). The Boss waits at the top.
   Older editions are islands across the sea; the next one is
   hidden in clouds until you beat the Boss.
   ============================================================= */
const $ = s => document.querySelector(s);
const TEASER = new URLSearchParams(location.search).has('teaser');
if (TEASER) document.documentElement.classList.add('teaser');
let paused = false;
addEventListener('message', (e) => { if (e.data === 'ng:pause') paused = true; if (e.data === 'ng:resume') paused = false; if (e.data === 'ng:night') setNight(true); if (e.data === 'ng:day') setNight(false); });
if (!window.THREE) { $('#loading').innerHTML = '<b>Could not load 3D</b>'; throw new Error('three.js missing'); }

const C = hex => new THREE.Color(hex).convertSRGBToLinear();
const YEL = '#FFD400', INK = '#0A0A0A';
const GAMES = [
  { key:'money',  name:'The ₦10K Money Mystery', short:'Money',  color:'#FFD400', text:'You get ₦10,000 for the week. Can you still have money on Friday? Save first, then spend smart.', goals:[['1★','Reach Friday'],['2★','Save ₦2,000'],['3★','Save ₦4,000']] },
  { key:'quiz',   name:'Superpower Challenge',  short:'Quiz',   color:'#2F7DE1', text:'Fast questions from this edition. Every right answer is +10 pts. Get them all for 3 stars.', goals:[['1★','3 right'],['2★','5 right'],['3★','All right']] },
  { key:'debate', name:'Debate of the Week',    short:'Debate', color:'#E0457B', text:'Big promises or clear plans? Pick your team, say why, and watch the live vote move.', goals:[['1★','Vote'],['2★','Give a reason'],['3★','Get 5 likes']] },
  { key:'ai',     name:'Cheat Code or Study Buddy?', short:'AI', color:'#2FA36B', text:'Is that AI prompt helping you learn, or skipping the learning? Sort them fast.', goals:[['1★','Finish'],['2★','6 right'],['3★','All right']] },
  { key:'promise',name:'Promise Checker',       short:'Promise',color:'#fcb92e', text:'A promise is easy. A plan has details. Cross the bridge by checking what a promise really says.', goals:[['1★','Check 1'],['2★','Check 3'],['3★','Spot the plan']] },

const noise = (x, z) => Math.sin(x * .15) * Math.cos(z * .13) * 1.2 + Math.sin(x * .37 + z * .21) * .6 + Math.sin(z * .5 - x * .3) * .3 + Math.sin(x * .9 + z * .7) * .12;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function height(x, z){
  const r = Math.hypot(x, z);
  const land = 1 - smooth(44, 60, r);
  const hill = 18 * Math.exp(-(r * r) / (2 * 15 * 15)) + 4 * Math.exp(-((x + 22) ** 2 + (z - 18) ** 2) / 120);
  return land * (2.4 + noise(x, z) * .9 + hill) + (1 - land) * -4;
}
function island(size, seg, palette, hFn){
  const g = new THREE.PlaneGeometry(size, size, seg, seg);

  const p = g.attributes.position, cols = [];
  const sand = C(palette.sand), grass = C(palette.grass), grass2 = C(palette.grass2), rock = C(palette.rock), tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), y = hFn(x, z);
    p.setY(i, y);
    const t = (Math.sin(x * .8) * Math.cos(z * .7) + 1) / 2;
    if (y < 1.3) tmp.copy(sand);
    else if (y > 15.5) tmp.copy(rock).lerp(grass2, .25);
    else tmp.copy(grass).lerp(grass2, t * .8 + smooth(6, 15, y) * .3);
    if (y > 1.3 && y < 2.0) tmp.lerp(sand, .5);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0 }));
  m.receiveShadow = true; m.castShadow = true;
  return m;
}

function ribbon(width, lift, color, rough, from = 0, to = ROAD.length - 1){
  const pos = [], idx = [];
  for (let i = from; i <= to; i++){
    const a = ROAD[Math.max(0, i - 1)], b = ROAD[Math.min(ROAD.length - 1, i + 1)];
    const tx = b.x - a.x, tz = b.z - a.z, l = Math.hypot(tx, tz) || 1, nx = -tz / l, nz = tx / l;
    for (const s of [-1, 1]){ const x = ROAD[i].x + nx * width / 2 * s, z = ROAD[i].z + nz * width / 2 * s; pos.push(x, height(x, z) + lift, z); }
    if (i > from) { const k = (i - from) * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: C(color), roughness: rough, polygonOffset: true, polygonOffsetFactor: -2, side: THREE.DoubleSide }));
  m.receiveShadow = true; scene.add(m); return m;
}

const RANKS = [['Rookie', 0], ['Player One', 50], ['Combo Kid', 150], ['Rising Voice', 300], ['Brain Boss', 600], ['Game Changer', 1000], ['Street Smart', 1600], ['NextGen Legend', 2500]];
function levelFor(p){ let i = 0; RANKS.forEach((r, k) => { if (p >= r[1]) i = k; }); const next = RANKS[i + 1]; return { level: i + 1, name: RANKS[i][0], next: next ? next[0] : null, toNext: next ? next[1] - p : 0, pct: next ? Math.min(100, (p - RANKS[i][1]) / (next[1] - RANKS[i][1]) * 100) : 100 }; }
function renderHud(){
  const L = levelFor(prog.points);
  $('#ptsNum').textContent = prog.points; $('#lvlNum').textContent = L.level; $('#lvlSmall').textContent = `Level ${L.level}`; $('#rankName').textContent = L.name;
  $('#xpFill').style.width = L.pct + '%'; $('#avaRing').style.background = `conic-gradient(#FFD400 0 ${L.pct}%, rgba(255,255,255,.15) 0)`;
  const c = currentIndex(); $('#place').textContent = `Oct 2026 Island · ${Math.min(7, c)} / 7 cleared`;
  $('#callout').textContent = c <= 6 ? `▶ ${GAMES[c].short} · Play` : '★ Island cleared';
}

let timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const every = (fn, ms) => { timers.push(setInterval(fn, ms)); };

function finish(L, stars, info){

  const before = levelFor(prog.points), wasCurrent = i === currentIndex();

  const body = $('#gBody');
  body.innerHTML = `<div class="res">
    <div class="res-stars">${[0, 1, 2].map(k => `<span class="${k < stars ? 'on' : ''}" style="animation-delay:${.15 + k * .25}s">★</span>`).join('')}</div>
    <h3>${['So close!', 'Nice!', 'Great job!', 'Perfect!'][stars]}</h3>
    <p>${info.line || ''}</p>
    ${stars ? `<div class="res-pts">${pts ? `+${pts} pts` : 'Points already counted for this edition'}</div>` : '<p><b>Get at least 1 star</b> to open the next level.</p>'}
    <div class="res-xp"><div class="res-xp-top"><b>Level ${after.level} · ${after.name}</b><span>${prog.points} XP</span></div><div class="xpbar"><i style="width:${after.level > before.level ? 0 : before.pct}%"></i></div><small>${after.next ? `${after.toNext} XP to ${after.next}` : 'Top level!'}</small></div>
    ${after.level > before.level ? `<div class="rankup">⬆ LEVEL UP! You're now a ${after.name}</div>` : ''}
    <div class="api"><b>On the live site</b><br>${API[L.g.key](pts)}<br><span>Stars and unlocked levels: new, saved on the student's account.</span></div>
    <div class="res-btns"><button class="ghost" id="rRe">↻ Replay</button><button class="yel" id="rGo">${stars ? (i === 6 ? 'Open the next island ▶' : 'Next level ▶') : 'Try again'}</button></div></div>`;
  later(() => { const bar = body.querySelector('.xpbar i'); if (bar) bar.style.width = after.pct + '%'; }, 450);
  SND.mode('result'); if (stars) SND.win(); else SND.lose();
  for (let k = 0; k < stars; k++) later(() => SND.star(k), 150 + k * 250);
  if (pts) later(SND.points, 950); if (after.level > before.level) later(SND.levelUp, 1150);
  renderHud();
  $('#rRe').onclick = () => startGame(L);
  $('#rGo').onclick = () => { if (!stars) return startGame(L); quitGame(); advance(L, wasCurrent); };
}
function advance(L, unlocked){
  applyStates(); LEVELS.forEach(x => buildLevel(x, unlocked && x.i === L.i + 1)); buildWalked(); renderHud();
  if (L.i === 6){ placePin(); if (unlocked) unlockNextIsland(); return; }
  const N = LEVELS[L.i + 1];
  flyTo(new THREE.Vector3(N.pos.x, N.pos.y + 2, N.pos.z), 30, .55, yawTo(N.pos));

  else placePin();
}

const opts = (list, onPick) => list.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span>${o}</button>`).join('');
function askQuestions(body, qs, { boss, onDone }){
  let qi = 0, right = 0, hp = 100;
  const step = () => {
    const Q = qs[qi]; let locked = false, left = 100;
    body.innerHTML = `${boss ? `<div class="boss"><div class="bossface" id="bf">👑</div><div class="hp"><i id="hp" style="width:${hp}%"></i></div><small>BOSS HP</small></div><div class="tbar"><i id="tb" style="width:100%"></i></div>` : ''}
      <div class="prog">${qs.map((_, k) => `<i class="${k < qi ? 'on' : ''}"></i>`).join('')}</div>
      <p class="gq">${Q.q}</p><div>${opts(Q.o)}</div><div class="gmsg" id="qm"></div>`;
    const pick = (k) => {
      if (locked) return; locked = true;
      const btns = body.querySelectorAll('.opt'); btns.forEach(b => b.disabled = true);
      if (k >= 0) btns[k].classList.add(k === Q.a ? 'right' : 'wrong'); btns[Q.a].classList.add('right');
      const ok = k === Q.a; if (ok) right++; if (ok) (boss ? SND.hit() : SND.right()); else SND.wrong();
      $('#qm').textContent = ok ? (boss ? '💥 Hit! The Boss is losing HP.' : '✅ Correct! +10 pts') : k < 0 ? '⏰ Too slow!' : '❌ Not this time.';
      if (boss && ok){ hp -= 100 / qs.length; $('#hp').style.width = Math.max(0, hp) + '%'; const f = $('#bf'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit'); }
      later(() => { qi++; if (qi < qs.length) step(); else onDone(right); }, 1100);
    };
    body.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    let lastSec = 99; if (boss) every(() => { if (locked) return; left -= 100 / 120; const tb = $('#tb'); if (tb) tb.style.width = Math.max(0, left) + '%'; const sec = Math.ceil(left * .12); if (sec <= 4 && sec !== lastSec){ lastSec = sec; SND.tick(); } if (left <= 0) pick(-1); }, 100);
  };
  step();
}

$('#btnWorld').onclick = () => { $('#card').classList.remove('open'); flyTo(new THREE.Vector3(0, 0, -20), 330, 1.0); };
$('#callout').onclick = () => { const c = currentIndex(); if (c <= 6) openLevel(LEVELS[c]); };
$('#reset').onclick = () => { SND.tap(); prog = fresh(); saveProg(); applyStates(); LEVELS.forEach(L => buildLevel(L)); buildWalked(); placePin(); renderHud(); toast('↺ Demo reset. Start again from level 1.'); };

// sound button
const sndBtn = $('#snd'); const drawSnd = () => { sndBtn.textContent = SND.on ? '🔊' : '🔇'; sndBtn.setAttribute('aria-pressed', String(!SND.on)); }; drawSnd();
sndBtn.onclick = () => { SND.start(); SND.toggle(); drawSnd(); if (SND.on) SND.tap(); };
// ---------- day / night ----------
let night = matchMedia('(prefers-color-scheme: dark)').matches;
function setNight(n){
  night = n;
  skyU.top.value.set(n ? '#05070f' : '#3f8fe0'); skyU.mid.value.set(n ? '#1A1A18' : '#bfe3ff'); skyU.bot.value.set(n ? '#2A2926' : '#fff4d6');
  scene.fog.color.copy(C(n ? '#14141a' : '#cfe8ff'));
  hemi.intensity = n ? .28 : .75; sun.intensity = n ? .35 : 1.5; sun.color.copy(C(n ? '#9fb4ff' : '#fff2d6'));
  sunBall.material.color.set(n ? '#e8ecff' : '#fff3b0'); sunBall.scale.setScalar(n ? .6 : 1);
  stars.material.opacity = n ? .9 : 0;
  glowMats.forEach(m => m.emissiveIntensity = n ? 1.6 : .1);
  sea.material.color.copy(C(n ? '#163a6e' : '#2F7DE1'));
}
$('#night').onclick = () => setNight(!night);
setNight(night);

// ---------- helpers ----------
let tt; function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2800); }
function hideHint(){ $('#hint').style.opacity = 0; }
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- animate ----------
const clock = new THREE.Clock(); const tmp = new THREE.Vector3();
let busT = 0;
function frame(){
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  // idle: slowly circle the island
  if (paused){ requestAnimationFrame(frame); return; }
  if (TEASER){ goal.yaw += dt * .09; goal.dist = innerWidth < 560 ? 120 : 92; goal.pitch = .5; goal.target.set(0, 7, 0); }
  else if (auto || performance.now() - lastInput > 9000) goal.yaw += dt * .06;
  const k = 1 - Math.pow(.0025, dt);
  cam.yaw += (goal.yaw - cam.yaw) * k; cam.pitch += (goal.pitch - cam.pitch) * k; cam.dist += (goal.dist - cam.dist) * k; cam.target.lerp(goal.target, k);
  camera.position.set(cam.target.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cam.target.y + Math.sin(cam.pitch) * cam.dist, cam.target.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  const floor = height(camera.position.x, camera.position.z) + 3; if (camera.position.y < floor) camera.position.y = floor;
  camera.lookAt(cam.target);

  // sea waves
  const pa = seaG.attributes.position.array;
  for (let i = 0; i < pa.length; i += 3){ const x = seaBase[i], z = seaBase[i + 2]; pa[i + 1] = Math.sin(x * .05 + t * 1.2) * .35 + Math.cos(z * .06 + t) * .3; }
  seaG.attributes.position.needsUpdate = true; seaG.computeVertexNormals();
  foam.material.opacity = .25 + Math.sin(t * 1.5) * .1;

  // level life
  const now = performance.now();
  if (pinAnim){
    const e = Math.min(1, (now - pinAnim.t0) / pinAnim.dur), ee = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
    const p = ROAD[Math.round(pinAnim.a + (pinAnim.b - pinAnim.a) * ee)];
    pin.position.set(p.x, p.y + 6.9 + Math.abs(Math.sin(e * Math.PI * 5)) * 2.2, p.z); pin.rotation.y = t * 6;
    goal.target.set(p.x, p.y + 2, p.z);
    if (e >= 1){ pinAnim = null; placePin(); }
  } else { pin.position.y += (nowL().pos.y + 6.9 + Math.sin(t * 3) * .6 - pin.position.y) * .2; pin.rotation.y = t * 1.2; }
  { const s = 1 + ((t * .8) % 1) * .8; ring.scale.set(s, s, s); ring.material.opacity = .8 * (1 - ((t * .8) % 1)); }
  LEVELS.forEach(L => { const p0 = L.group.userData.pop; if (p0){ const e = Math.min(1, (now - p0) / 700), s = e < 1 ? 1 + Math.sin(e * Math.PI) * .6 : 1; L.group.scale.setScalar(s); if (e >= 1) L.group.userData.pop = 0; } });
  LEVELS.forEach(L => { const s0 = L.group.userData.shake; if (s0){ const e = (performance.now() - s0) / 300; L.group.position.x = L.pos.x + (e < 1 ? Math.sin(e * 30) * .4 : 0); if (e >= 1) L.group.userData.shake = 0; } });
  scene.traverse(o => {
    const u = o.userData; if (!u) return;
    if (u.spin) o.rotation.z = t * 2;
    if (u.spinY) o.rotation.y = t * 1.2;
    if (u.crown){ o.rotation.y = t * .8; o.position.y = 12 + Math.sin(t * 2) * .5; }
    if (u.blink) o.visible = Math.sin(t * 6) > -.3;
    if (u.flag){ const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i++){ const x = p.getX(i); p.setZ(i, Math.sin(x * 3 + t * 6) * .15 * (x + 1)); } p.needsUpdate = true; }
  });
  clouds.forEach((c, i) => { c.position.x += Math.sin(i) * dt * .8; });
  // bus loops along the first part of the road
  busT = (busT + dt * .012) % 1; const bi = Math.floor(busT * 300) + 5, bp = ROAD[bi], bq = ROAD[bi + 1];
  bus.position.set(bp.x, bp.y + .35, bp.z); bus.lookAt(bq.x, bq.y + .35, bq.z);

  // "Play" callout over the current level
  const NL = nowL(); tmp.set(NL.pos.x, NL.pos.y + 9.5, NL.pos.z).project(camera);
  const co = $('#callout'), vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1 && cam.dist < 140 && !pinAnim && !$('#card').classList.contains('open') && !$('#game').classList.contains('open') && currentIndex() <= 6;
  co.style.opacity = vis ? 1 : 0; co.style.pointerEvents = vis ? 'auto' : 'none';
  co.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth}px, ${(-tmp.y * .5 + .5) * innerHeight}px) translate(-50%,-100%)`;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => { $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 700); }, 300);
</script>
</body>
</html>
